# ─────────────────────────────────────────────────────────────
# Netlify — sistema operativo: app.bostonskillingcenter.com (apps/app)
#
#   Package directory : apps/app
#   Base directory    : (sin definir)
#
# Variables de entorno: definirlas en el panel de Netlify, NUNCA aquí.
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   SUPABASE_SERVICE_ROLE_KEY   (solo servidor; jamás con prefijo NEXT_PUBLIC)
# ─────────────────────────────────────────────────────────────

[build]
  command = "pnpm --filter @bsc/app build"
  publish = "apps/app/.next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
